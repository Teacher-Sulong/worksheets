      <p>© 2026 그래프 읽기 맞춤형 학습지 · <b class="text-slate-200">made by 특수교사 슬옹쌤</b></p>

  <script>
    // ── QR 정답지 설정: 스캔하면 이 생성기의 정답지 화면이 바로 열려요 ──
    const ANSWER_URL = 'https://teacher-sulong.github.io/worksheets/graph.html';
    let QR_MODE = 'link';
    // 정답지 화면: 휴대폰 화면 폭에 학습지 한 장이 통째로 보이도록 맞춤
    function fitAnswerView(){ if(!document.body.classList.contains('answer-view'))return; var c=document.getElementById('print-pages-container'); if(!c)return; c.style.zoom=Math.min(1,(window.innerWidth-12)/850); }
    window.addEventListener('resize', fitAnswerView);
    window.addEventListener('hashchange', function () { if (/^#k[-=]/.test(location.hash)) location.reload(); });
// ═════════════════════ 공통 코어 (시계·달력 생성기와 동일한 구성) ═════════════════════
// ───────── 시드 난수 (QR 재현용) ─────────
function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
let rng = Math.random;
function randInt(a,b){return Math.floor(rng()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(rng()*arr.length)];}
function shuffle(a){const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));const t=r[i];r[i]=r[j];r[j]=t;}return r;}
function sample(a,n){return shuffle(a).slice(0,n);}
function chance(p){return rng()<p;}
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return h>>>0;}
function comma(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,',');}
function plain(h){return String(h).replace(/<svg[\s\S]*?<\/svg>/g,'').replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/\s+/g,' ').trim();}
function uniq(a){return [...new Set(a)];}
function sum(a){return a.reduce((x,y)=>x+y,0);}

// ───────── 한국어 조사 ─────────
const NAMES=['이준','하준','도윤','서준','은우','시우','유준','주원','서윤','서아','이서','지유','하린','아린','시아','하은','소율','채원'];
function hasBatchim(w){if(!w)return false;const c=w.charCodeAt(w.length-1);if(c<0xac00||c>0xd7a3)return false;return (c-0xac00)%28>0;}
function dispName(n){return n+(hasBatchim(n)?'이':'');}
function josaW(w,t){const b=hasBatchim(w);if(t==='eun')return b?'은':'는';if(t==='i')return b?'이':'가';if(t==='eul')return b?'을':'를';if(t==='wa')return b?'과':'와';if(t==='ro')return b?'으로':'로';return '';}
function josaNum(s,t){const d=String(s).replace(/[^0-9]/g,'').slice(-1);const b='013678'.includes(d||'2');if(t==='eun')return b?'은':'는';if(t==='i')return b?'이':'가';if(t==='eul')return b?'을':'를';if(t==='wa')return b?'과':'와';return '';}
function pickName(){return pick(NAMES);}
function nm(n,t){const d=dispName(n);return d+josaW(d,t);}   // nm('하준','i') → 하준이가
function jw(w,t){return w+josaW(w,t);}                       // jw('사과','eul') → 사과를

// ───────── SVG 헬퍼 ─────────
let _u=0;function uid(){return 'u'+(++_u);}
function svgWrap(w,h,inner,cls){return `<svg class="viz ${cls||''}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" font-family="'Noto Sans KR',sans-serif">${inner}</svg>`;}
function Tx(x,y,s,o){o=o||{};const size=o.size||12,fill=o.fill||'#1e293b',anchor=o.anchor||'middle',weight=o.weight||600;return `<text x="${x}" y="${y}" font-size="${size}" fill="${fill}" text-anchor="${anchor}" font-weight="${weight}"${o.rot?` transform="rotate(${o.rot} ${x} ${y})"`:''}${o.op?` opacity="${o.op}"`:''}>${s}</text>`;}
function ansG(inner){return `<g class="ansonly">${inner}</g>`;}
function rnd1(n){return Math.round(n*10)/10;}
function r2(n){return Math.round(n*100)/100;}

// ───────── 상태 ─────────
const ALL_S=['subjective','objective','narrative'];
const KOREAN_STYLES={subjective:'주관식',objective:'객관식',narrative:'문장제'};
let ALL_T=[],TYPE={};
const O=()=>config.opt;
let config=null,generatedPages=[],pageSeeds=[],showAnswers=false,answerViewMode=false;

function initConfig(){
  GEN.groups.forEach(g=>g.types.forEach(t=>{ALL_T.push(t.key);TYPE[t.key]=t;}));
  config={pages:2,questionsPerPage:9,level:GEN.defLevel,progression:'single',bigMode:false,boldKey:true,opt:{},sel:{},
    styles:ALL_S.slice(),types:ALL_T.slice(),typeWeights:{},dateStr:''};
  GEN.checks.forEach(c=>config.opt[c.id]=!!c.def);
  GEN.selects.forEach(s=>config.sel[s.id]=s.def);
}

// ───────── 문제 생성 ─────────
function perQLevel(gi,total){
  const L=config.level,mode=config.progression;
  if(mode==='single'||L<=1||total<=1)return L;
  const r=gi/(total-1);let v;
  if(mode==='asc')v=1+Math.round(r*(L-1));
  else if(mode==='desc')v=1+Math.round((1-r)*(L-1));
  else v=randInt(1,L);
  return Math.max(1,Math.min(L,v));
}
function makeQuestion(type,style,lv){
  const o=GEN.build(type,style,lv);
  if(!o)return null;
  o.type=type;o.style=style;o.lv=lv;
  if(!o.viz)o.viz='';
  if(style==='objective'){
    if(!o.choices){
      const a=String(o.ans);
      const ds=uniq((o.distract||[]).map(String)).filter(x=>x!==a);
      if(ds.length<3)return null;
      const ch=shuffle([a].concat(shuffle(ds).slice(0,3)));
      o.choices=ch;o.correctIdx=ch.indexOf(a);
    }
    o.ansKey=(o.correctIdx+1)+'번';
  } else {
    o.ansKey=plain(o.ans);
  }
  return o;
}
function buildPageQuestions(seed,pIdx){
  rng=mulberry32(seed>>>0);
  const qpp=config.questionsPerPage,total=config.pages*qpp,out=[],seen=new Set();
  const selT=ALL_T.filter(t=>config.types.includes(t));const types=selT.length?selT:[ALL_T[0]];
  const selS=ALL_S.filter(s=>config.styles.includes(s));const styles=selS.length?selS:['subjective'];
  for(let q=0;q<qpp;q++){
    const gi=pIdx*qpp+q;const lv=perQLevel(gi,total);
    const dist=t=>{const T=TYPE[t];return lv<T.minLv?T.minLv-lv:(lv>(T.maxLv||99)?lv-(T.maxLv||99):0);};
    let cand=types.filter(t=>dist(t)===0);
    if(!cand.length){const md=Math.min(...types.map(dist));cand=types.filter(t=>dist(t)===md);}
    const pool=[];
    cand.forEach(t=>{let w=Math.max(1,Math.min(5,config.typeWeights[t]||1));if(TYPE[t].minLv>=lv-1&&TYPE[t].minLv>1)w*=2;for(let i=0;i<w;i++)pool.push(t);});
    let o=null;
    for(let n=0;n<40;n++){
      const type=pool[Math.floor(rng()*pool.length)];const T=TYPE[type];
      const eLv=Math.max(T.minLv,Math.min(T.maxLv||99,lv));
      const allowed=T.styles||ALL_S;let av=styles.filter(s=>allowed.includes(s));if(!av.length)av=[allowed[0]];
      const style=pick(av);
      let c=null;
      try{c=makeQuestion(type,style,eLv);}catch(e){console.error('build error',type,e&&e.stack||e);c=null;}
      if(!c)continue;
      const sig=hash(plain(c.q)+'|'+c.ansKey+'|'+String(c.viz).replace(/u\d+/g,''));
      if(!seen.has(sig)||n>=39){o=c;seen.add(sig);break;}
    }
    if(!o){
      try{o=makeQuestion(types[0],'subjective',Math.max(TYPE[types[0]].minLv,Math.min(TYPE[types[0]].maxLv||99,lv)));}catch(e){console.error('fallback error',e);}
    }
    if(!o)o={q:'(문제 생성 오류)',viz:'',ans:'-',ansKey:'-',style:'subjective',type:types[0],lv:lv};
    o.seq=q;out.push(o);
  }
  out.forEach((o,i)=>{o.num=i+1;o.globalNum=pIdx*qpp+i+1;});
  return out;
}

// ───────── QR 자동 채점 (상태 인코딩) ─────────
function encodeState(seed,pIdx){
  let tmask=0;ALL_T.forEach((t,i)=>{if(config.types.includes(t))tmask|=(1<<i);});
  let smask=0;ALL_S.forEach((s,i)=>{if(config.styles.includes(s))smask|=(1<<i);});
  let flags=(config.bigMode?1:0)|(config.boldKey?2:0);
  GEN.checks.forEach((c,i)=>{if(config.opt[c.id])flags|=(1<<(2+i));});
  const parts=[flags,tmask,smask,config.questionsPerPage,config.pages,pIdx,(seed>>>0),config.level,({single:0,asc:1,desc:2,mix:3}[config.progression]||0)];
  GEN.selects.forEach(s=>{parts.push(Math.max(0,s.options.findIndex(o=>o[0]===config.sel[s.id])));});
  let wStr='',any=false;ALL_T.forEach(t=>{const w=Math.max(1,Math.min(5,config.typeWeights[t]||1));if(w!==1)any=true;wStr+=String(w);});
  const out=parts.map(n=>n.toString(36));if(any)out.push(wStr);return out.join('-');
}
function decodeState(str){
  const tok=str.split(/[.-]/);const nSel=GEN.selects.length;const p=tok.map((x,i)=>i<9+nSel?parseInt(x,36):x);
  const flags=p[0];const wStr=(tok.length>9+nSel)?tok[9+nSel]:null;
  const w={};ALL_T.forEach((t,i)=>{w[t]=wStr?(parseInt(wStr[i],10)||1):1;});
  const opt={};GEN.checks.forEach((c,i)=>{opt[c.id]=!!(flags&(1<<(2+i)));});
  const sel={};GEN.selects.forEach((s,i)=>{const o=s.options[p[9+i]];sel[s.id]=o?o[0]:s.def;});
  return {big:(flags&1)?1:0,bk:(flags&2)?1:0,opt,sel,ty:ALL_T.filter((t,i)=>p[1]&(1<<i)),st:ALL_S.filter((s,i)=>p[2]&(1<<i)),qpp:p[3],pg:p[4],p:p[5],sd:(p[6]>>>0),lv:p[7]||1,prog:({0:'single',1:'asc',2:'desc',3:'mix'}[p[8]]||'single'),w};
}
function applyState(s){
  config.bigMode=!!s.big;config.boldKey=!!s.bk;config.opt=s.opt;config.sel=s.sel;config.level=s.lv;config.progression=s.prog||'single';
  config.styles=(s.st&&s.st.length)?s.st:['subjective'];config.types=(s.ty&&s.ty.length)?s.ty:[ALL_T[0]];
  config.questionsPerPage=s.qpp;config.pages=s.pg;config.typeWeights=s.w||{};
}
function buildAnswerKeyText(pIdx){const qs=generatedPages[pIdx]||[];return qs.map(q=>`${q.globalNum}) ${q.ansKey}`).join('  ');}
function makeQRCodes(){
  if(typeof qrcode==='undefined')return;
  try{if(qrcode.stringToBytesFuncs&&qrcode.stringToBytesFuncs['UTF-8'])qrcode.stringToBytes=qrcode.stringToBytesFuncs['UTF-8'];}catch(e){}
  const hosted=(QR_MODE!=='text')&&(!!ANSWER_URL||/^https?:$/.test(location.protocol));const base=hosted?(ANSWER_URL||location.href.split('#')[0]):'';
  generatedPages.forEach((_,pIdx)=>{
    const el=document.getElementById('qr-'+pIdx);if(!el)return;
    const data=hosted?(base+'#k-'+encodeState(pageSeeds[pIdx],pIdx)):buildAnswerKeyText(pIdx);
    const draw=(txt,ec)=>{const qr=qrcode(0,ec);qr.addData(txt,'Byte');qr.make();el.innerHTML=qr.createSvgTag({cellSize:4,margin:3,scalable:true});const svg=el.querySelector('svg');if(svg){svg.setAttribute('width','100%');svg.setAttribute('height','100%');svg.style.display='block';}};
    try{draw(data,'L');}catch(e){try{draw(data,'M');}catch(e2){el.innerHTML='<span class="text-[7px] text-slate-400">QR</span>';}}
  });
}
function tryAnswerView(){
  const h=location.hash||'';const i=h.search(/k[-=]/);if(i<0)return false;
  let s;try{s=decodeState(h.slice(i+2));}catch(e){return false;}if(!s||s.sd===undefined||isNaN(s.sd))return false;
  applyState(s);answerViewMode=true;showAnswers=true;
  generatedPages=[buildPageQuestions(s.sd>>>0,s.p)];pageSeeds=[s.sd>>>0];
  document.body.classList.add('answer-view');setTimeout(fitAnswerView,30);renderHTML();
  document.querySelectorAll('.answer-box').forEach(el=>{el.classList.remove('invisible','opacity-0');el.classList.add('visible','opacity-100');});
  const cont=document.getElementById('print-pages-container');
  if(cont)cont.insertAdjacentHTML('afterbegin','<div class="max-w-[840px] mx-auto mb-3 bg-emerald-600 text-white rounded-xl px-4 py-2 text-sm font-bold flex items-center justify-between"><span>✔ 정답지 (채점용) — made by 특수교사 슬옹쌤</span></div>');
  tryIcons();return true;
}

// ───────── 옵션 패널 (동적 구성) ─────────
function buildPanel(){
  const C='rose-600';
  const lvOpts=GEN.levels.map((l,i)=>`<option value="${i+1}"${(i+1)===GEN.defLevel?' selected':''}>${l.s} (${l.d})</option>`).join('');
  const checks=GEN.checks.map(c=>`<label class="flex items-center gap-2.5 text-xs text-slate-600 cursor-pointer"><input type="checkbox" id="opt-${c.id}" class="w-4 h-4 text-${C} rounded"${c.def?' checked':''} onchange="regenerateSheet()"><span>${c.label}</span></label>`).join('');
  const sels=GEN.selects.map(s=>`<div class="space-y-3"><label class="block text-sm font-semibold text-slate-700">${s.title}</label><div class="grid grid-cols-${Math.min(3,s.options.length)} gap-2">${s.options.map(o=>`<label class="cursor-pointer border border-slate-200 rounded-lg p-2 flex flex-col items-center gap-1 bg-white hover:bg-slate-50 [&:has(input:checked)]:border-${C} [&:has(input:checked)]:bg-rose-50"><input type="radio" name="sel-${s.id}" value="${o[0]}" class="sr-only"${o[0]===s.def?' checked':''} onchange="regenerateSheet()"><span class="text-xs font-semibold text-center">${o[1]}</span></label>`).join('')}</div>${s.note?`<p class="text-xs text-slate-400">${s.note}</p>`:''}</div>`).join('');
  const groups=GEN.groups.map(g=>`<div class="flex items-center justify-between pt-1"><span class="text-[10px] font-extrabold text-slate-400 uppercase tracking-wide">${g.label}</span><label class="flex items-center gap-1 text-[10px] text-slate-500 cursor-pointer"><input type="checkbox" class="group-toggle w-3.5 h-3.5 text-${C} rounded" data-grp="grp-${g.id}" checked onchange="toggleGroup(this,'grp-${g.id}')">전체</label></div>
        <div id="grp-${g.id}" class="grid grid-cols-1 gap-2 border border-slate-100 p-2 rounded-lg bg-slate-50">${g.types.map(t=>`<label class="flex items-center gap-2 text-xs text-slate-600 cursor-pointer"><input type="checkbox" class="type-checkbox w-3.5 h-3.5 text-${C} rounded" value="${t.key}" checked onchange="regenerateSheet()"><span>${t.label}</span></label>`).join('')}</div>`).join('');
  document.getElementById('option-panel').innerHTML=`
      <div class="flex items-center gap-2 pb-4 border-b border-slate-100">
        <i data-lucide="sliders" class="w-5 h-5 text-${C}"></i>
        <h2 class="text-lg font-bold text-slate-950">학습지 형성 옵션</h2>
      </div>
      <div class="space-y-3">
        <label class="block text-sm font-semibold text-slate-700">인쇄 페이지 수 (최대 10장)</label>
        <select id="sheet-pages" class="w-full rounded-lg border border-slate-200 p-2.5 text-sm bg-white focus:ring-2 focus:ring-${C} focus:outline-none font-medium" onchange="setPagesDropdown(this.value)">

function readOptions(){
  const g=id=>document.getElementById(id);
  config.level=parseInt(g('difficulty').value)||GEN.defLevel;
  config.progression=g('progression').value||'single';
  GEN.checks.forEach(c=>{config.opt[c.id]=g('opt-'+c.id).checked;});
  config.bigMode=g('opt-big').checked;config.boldKey=g('opt-boldkey').checked;
  GEN.selects.forEach(s=>{const r=document.querySelector(`input[name="sel-${s.id}"]:checked`);config.sel[s.id]=r?r.value:s.def;});
  config.typeWeights={};document.querySelectorAll('.type-weight').forEach(i=>config.typeWeights[i.dataset.type]=Math.max(1,Math.min(5,parseInt(i.value)||1)));
  const st=[];if(g('style-subjective').checked)st.push('subjective');if(g('style-objective').checked)st.push('objective');if(g('style-narrative').checked)st.push('narrative');
  config.styles=st.length?st:['subjective'];if(!st.length)g('style-subjective').checked=true;
  const ty=[];document.querySelectorAll('.type-checkbox:checked').forEach(e=>ty.push(e.value));
  config.types=ty.length?ty:[ALL_T[0]];if(!ty.length)document.querySelector('.type-checkbox').checked=true;
}
function toggleGroup(cb,gid){const g=document.getElementById(gid);if(g)g.querySelectorAll('.type-checkbox').forEach(x=>{x.checked=cb.checked;});regenerateSheet();}
function syncGroupToggles(){document.querySelectorAll('.group-toggle').forEach(gt=>{const g=document.getElementById(gt.dataset.grp);if(!g)return;const items=[...g.querySelectorAll('.type-checkbox')];gt.checked=items.length>0&&items.every(x=>x.checked);});}
function regenerateSheet(){
  syncGroupToggles();readOptions();generatedPages=[];pageSeeds=[];
  const base=((Date.now()^Math.floor(Math.random()*0x1000000))&0xFFFFFF)>>>0;
  for(let p=0;p<config.pages;p++){const sd=(base+p*0x9E3779B1)>>>0;pageSeeds.push(sd);generatedPages.push(buildPageQuestions(sd,p));}
  renderHTML();tryIcons();
}

// ───────── 학습지 HTML ─────────
function renderChoices(q){
  const maxLen=Math.max(...q.choices.map(x=>plain(x).length));
  const long=maxLen>9;
  const svgC=q.choices.some(x=>/<svg/.test(x));
  const cols=svgC?'grid-cols-4':(maxLen>13?'grid-cols-1':'grid-cols-2');
  return `<div class="mt-1.5"><div class="grid ${cols} gap-x-1 gap-y-0.5">${q.choices.map((ch,i)=>`<div class="${long?'text-[10px]':'text-[11px]'} text-slate-600 flex items-center gap-1"><span class="inline-block w-3.5 h-3.5 shrink-0 rounded-full border border-slate-300 text-[9px] text-center leading-3.5 font-bold">${i+1}</span><span class="${svgC?'':(maxLen>13?'flex-1 break-keep leading-tight':'flex-1 break-keep leading-tight')}">${ch}</span></div>`).join('')}</div><div class="mt-1 text-[9px] border-t border-slate-100 pt-0.5 text-slate-400">정답 기입: ( <span class="answer-box ${showAnswers?'visible text-red-500 font-bold text-xs':'invisible opacity-0'}">${q.correctIdx+1}</span> )</div></div>`;
}
// 카드 내용이 넘칠 때 자동으로 조금씩 줄여 맞춤(잘림 방지)
function fitCards(){document.querySelectorAll('.print-area > div.grid > div').forEach(function(card){var inner=card.children[0];if(!inner)return;inner.style.zoom='';var z=1,g=0;while(card.scrollHeight-card.clientHeight>1&&z>0.5&&g++<14){z=Math.max(0.5,z-0.05);inner.style.zoom=z;}});}
function renderHTML(){

  const bg='bg-rose-600 text-white border-rose-600 font-bold',off='bg-slate-50 text-slate-400 border-slate-200 font-normal';

    const sBadges=ALL_S.map(s=>`<span class="${config.styles.includes(s)?bg:off} border px-1.5 py-0.2 rounded text-[9px] whitespace-nowrap shrink-0">${KOREAN_STYLES[s]}</span>`).join('');

    const tRows=[];for(let i=0;i<tBadges.length;i+=6)tRows.push(`<div class="flex gap-1 flex-wrap">${tBadges.slice(i,i+6).join('')}</div>`);
    const progLbl={single:'단일 (고정)',asc:'쉬움→어려움',desc:'어려움→쉬움',mix:'혼합 (무작위)'}[config.progression]||'단일 (고정)';
    const L=GEN.levels[config.level-1]||GEN.levels[0];
    const lvMain=(config.progression==='single')?`${L.s} · ${L.d}`:`${L.s}까지 (${progLbl})`;
    const pageNum=(questions[0]&&questions[0].globalNum)?Math.floor((questions[0].globalNum-1)/config.questionsPerPage)+1:(pIdx+1);

    const qrBlock=`<div class="flex flex-col items-center gap-0.5 shrink-0"><div id="qr-${pIdx}" class="w-[100px] h-[100px] bg-white border border-slate-200 rounded p-1 flex items-center justify-center overflow-hidden"></div><span class="text-[8px] text-slate-500 font-bold leading-none">정답 QR (스캔)</span></div>`;

          </div>

    questions.forEach(q=>{
      let ans;
      if(q.style==='objective'&&q.choices){ans=renderChoices(q);}
      else{ans=`<div class="mt-1.5 border-b border-dashed border-slate-300 pb-0.5 flex items-baseline"><span class="text-[9px] text-slate-400 font-semibold mr-1 shrink-0 whitespace-nowrap">정답 :</span><span class="answer-box text-[11px] font-extrabold text-red-500 pl-0.5 ${showAnswers?'visible':'invisible opacity-0'}">${q.ans}</span></div>`;}
      let qt=q.q;if(!config.boldKey)qt=qt.replace(/<\/?b>/g,'');
      grid+=`<div class="flex flex-col justify-between border border-slate-200 p-2 rounded-xl bg-white relative overflow-hidden min-h-0 min-w-0">

    const wm=`<div class="mt-2 pt-1.5 border-t border-slate-100 flex items-center justify-between text-[8px] text-slate-300"><span>ⓒ made by 특수교사 슬옹쌤 · ${GEN.title} 학습지 자동 생성</span><span>PAGE ${pageNum} / ${config.pages}</span></div>`;
    page.innerHTML=header+grid+wm;c.appendChild(page);
  });
  try{fitCards();}catch(e){}
  makeQRCodes();

function toggleAnswers(){

function setupTypeWeights(){

function pickTheme(people){const ts=THEMES.filter(t=>!people||t.u==='명').map(t=>Object.assign({},t));return pick(ts);}
function mkData(lv,o){
  const th=pickTheme();o=o||{};
  let n=o.n||(lv<=2?randInt(3,4):randInt(4,5));
  let cats=sample(th.cats,Math.min(n,th.cats.length));n=cats.length;
  const step=o.step||1,kmax=o.kmax||9;
  const half=!!o.half;
  const pool=[];for(let k=(half?2:1);k<=(half?kmax*2:kmax);k++)pool.push(half?k*step/2:k*step);
  const vals=sample(pool,n);
  return {th,cats,vals,step,u:th.u,n};
}
function chk(d){return new Set(d.vals).size===d.vals.length;}
function lv2opts(lv,kind){
  // 막대/그림/표별 단계별 설정
  if(kind==='table'){if(lv<=1)return {step:1,kmax:9};if(lv===2)return {step:1,kmax:10};if(lv===3)return {step:1,kmax:12};if(lv===4)return {step:5,kmax:10};if(lv===5)return {step:10,kmax:10};return {step:10,kmax:30};}
  if(kind==='picto'){if(lv<=3)return {step:1,kmax:10,icon:1};if(lv===4)return {step:pick([5,10]),kmax:10};return {step:pick([5,10]),kmax:10};}
  if(kind==='bar'){if(lv<=3)return {step:pick([1,2]),kmax:(lv<=3?5:5)};if(lv===4)return {step:pick([2,5,5,10]),kmax:8};if(lv===5)return {step:pick([5,10]),kmax:9};return {step:pick([10,20,50]),kmax:8,half:true};}

        const o=lv2opts(Math.max(2,lv),'picto');let d,t=0;do{d=mkData(lv,Object.assign({},o,{n:randInt(3,Math.min(5,lv<=3?4:5))}));t++;}while(!chk(d)&&t<20);
        const unit=o.icon||o.step;
        const r=askData(d,lv,qKinds(lv),nar,n);if(!r)return null;
        return {q:r.q,viz:pictoSvg(d,d.th.title,unit),ans:r.ans,distract:r.distract};
      }
      case 'barRead':{
        const o=lv2opts(Math.max(3,lv),'bar');let d,t=0;do{d=mkData(lv,Object.assign({},o,{n:randInt(3,lv>=5?5:4)}));t++;}while(!chk(d)&&t<20);
        const horiz=lv>=5&&chance(.5);
        const kinds=qKinds(lv).concat(lv>=4?['scale']:[]);
        const r=askData(d,lv,kinds,nar,n);if(!r)return null;
        return {q:r.q,viz:barSvg(d,d.th.title,{horiz,showVal:O().showVal}),ans:r.ans,distract:r.distract};
      }
      case 'drawBar':{
        const o=lv2opts(Math.max(4,lv),'bar');o.step=pick([2,5]);o.kmax=pick([5,6]);let d,t=0;do{d=mkData(lv,Object.assign({},o,{n:randInt(3,4)}));t++;}while(!chk(d)&&t<20);
        const horiz=false;
        const q=nar?`${nm(n,'i')} ${d.th.nar} 표를 보고 <b>막대그래프</b>를 완성하세요.`:`표를 보고 <b>막대그래프</b>를 완성하세요.`;
        const W=240;
        const inner=(s)=>s.replace(/^<svg[^>]*>/,'').replace(/<\/svg>$/,'');
        const tb=tableSvg(d,d.th.title,true),bar=barSvg(d,'',{ansBars:true,H:150}),th=22+50+6;
        const viz=svgWrap(W,th+150,inner(tb)+`<g transform="translate(0 ${th})">${inner(bar)}</g>`);
        return {q,viz,ans:d.cats.map((c,i)=>`${c} ${d.vals[i]}${d.u}`).join(', '),distract:[]};
      }
      case 'lineRead':{
        const themes=[{t:'교실의 온도 변화',xu:'시각',xs:['9시','10시','11시','12시','1시','2시'],y:'℃',lo:16,hi:30,st:2},{t:'식물의 키 변화',xu:'요일',xs:['월','화','수','목','금'],y:'cm',lo:2,hi:20,st:2},{t:'월별 기온',xu:'월',xs:['3월','4월','5월','6월','7월'],y:'℃',lo:6,hi:30,st:5},{t:'나의 몸무게 변화',xu:'월',xs:['1월','2월','3월','4월','5월'],y:'kg',lo:30,hi:40,st:2}];
        const th=pick(themes);const nx=th.xs.length;const st=th.st;
        let ys,tt=0;do{ys=[];let v=randInt(Math.ceil(th.lo/st),Math.floor((th.lo+th.hi)/2/st))*st;for(let i=0;i<nx;i++){ys.push(v);v+=pick([-2,-1,0,1,1,2,2,3])*st;v=Math.max(th.lo,Math.min(th.hi,v));}tt++;}while(new Set(ys).size<3&&tt<30);
        const d={xs:th.xs,ys,step:st,yu:th.y,xu:th.xu};
        const kinds=['val','val','max','min','diff'];const kind=pick(kinds);
        const pre=nar?`${nm(n,'i')} ${th.t}${josaW(th.t,'eul')} 꺾은선그래프로 나타냈어요. `:'';
        let q,ans,dis;
        if(kind==='val'){const i=randInt(0,nx-1);q=`${pre}<b>${th.xs[i]}</b>의 값은 얼마일까요?`;ans=ys[i]+th.y;dis=[ys[i]+st,ys[i]-st,ys[i]+2*st,ys[i]-2*st,ys[i]+1].filter(x=>x>0&&x!==ys[i]).map(x=>x+th.y);}
        else if(kind==='max'||kind==='min'){const m=kind==='max'?Math.max(...ys):Math.min(...ys);const hits=ys.filter(v=>v===m).length;if(hits>1)return null;const i=ys.indexOf(m);q=`${pre}값이 가장 <b>${kind==='max'?'높은':'낮은'}</b> 때는 언제일까요?`;ans=th.xs[i];dis=th.xs.filter((_,j)=>j!==i);if(dis.length<3)return null;}
        else{const i=randInt(1,nx-1);const df=ys[i]-ys[i-1];if(df===0)return null;q=`${pre}<b>${th.xs[i-1]}</b>${josaW(th.xs[i-1],'eun')} <b>${th.xs[i]}</b> 사이에 값이 ${df>0?'몇 늘어났을까요?':'몇 줄어들었을까요?'}`;ans=Math.abs(df)+th.y;dis=[Math.abs(df)+st,Math.max(1,Math.abs(df)-st),Math.abs(df)*2,ys[i],ys[i-1]].filter(x=>x>0&&x!==Math.abs(df)).map(x=>x+th.y);}
        return {q,viz:lineSvg2(d,th.t),ans,distract:dis};
      }
      case 'doubleBar':{
        const o={step:pick([10,20,50]),kmax:8,half:false};const th=pickTheme(true);
        const nC=randInt(3,4);const cats=sample(th.cats,Math.min(nC,th.cats.length));
        const pool=[];for(let k=1;k<=8;k++)pool.push(k*o.step);
        const v1=cats.map(()=>pick(pool)),v2=cats.map(()=>pick(pool));
        const s1=pick(['남학생','1반']),s2=s1==='남학생'?'여학생':'2반';
        const d={cats,n:cats.length,v1,v2,s1,s2,step:o.step,u:'명',th};
        const kind=pick(['val','diff','more','sum']);const i=randInt(0,cats.length-1);
        let q,ans,dis;const pre=nar?`${nm(n,'i')} 두 집단의 ${th.title.replace('별 학생 수','')}${josaW(th.title.replace('별 학생 수',''),'eul')} 조사했어요. `:'';
        const who=pick([[s1,v1],[s2,v2]]);
        if(kind==='val'){q=`${pre}<b>${who[0]}</b>의 <b>${cats[i]}</b>${josaW(cats[i],'eun')} 몇 명일까요?`;const v=who[1][i];ans=v+'명';dis=[v+o.step,v-o.step,v+2*o.step,v-2*o.step,v+o.step/2].filter(x=>x>0&&x!==v).map(x=>x+'명');}
        else if(kind==='diff'){const df=Math.abs(v1[i]-v2[i]);if(df===0)return null;q=`${pre}<b>${cats[i]}</b>의 학생 수는 <b>${s1}</b>과 <b>${s2}</b>이 몇 명 차이일까요?`;ans=df+'명';dis=[df+o.step,Math.max(1,df-o.step),df*2,v1[i]+v2[i],df+2*o.step].filter(x=>x>0&&x!==df).map(x=>x+'명');}
        else if(kind==='more'){const diffs=cats.map((c,j)=>v1[j]-v2[j]);const cand=cats.map((c,j)=>j).filter(j=>diffs[j]>0);if(!cand.length||cand.length===cats.length)return null;
          const mx=cand.filter(j=>diffs[j]===Math.max(...cand.map(x=>diffs[x])));if(mx.length!==1)return null;q=`${pre}<b>${s1}</b>이 <b>${s2}</b>보다 더 많은 것 중 차이가 가장 큰 것은 무엇일까요?`;ans=cats[mx[0]];dis=cats.filter((c,j)=>j!==mx[0]).concat(['없다']);if(dis.length<3)return null;}
        else{q=`${pre}<b>${cats[i]}</b>의 학생 수는 <b>${s1}</b>과 <b>${s2}</b>${josaW(s2,'eul')} 합하여 모두 몇 명일까요?`;const t=v1[i]+v2[i];ans=t+'명';dis=[t+o.step,t-o.step,Math.abs(v1[i]-v2[i]),t+2*o.step,t+10].filter(x=>x>0&&x!==t).map(x=>x+'명');}
        return {q,viz:dbarSvg(d,th.title.replace('학생 수','학생 수 비교')),ans,distract:dis};
      }
      case 'pieRead':
      case 'bandRead':{
        const th=pickTheme(true);const K=randInt(3,5);const cats=sample(th.cats,Math.min(K,th.cats.length));
        let vals,t=0;do{const base=[5,10,15,20,25,30,35,40,45,50];const parts=[];let left=100;for(let i=0;i<cats.length-1;i++){const mx=left-5*(cats.length-1-i);const c=base.filter(b=>b<=mx&&b<=60);const v=pick(c);parts.push(v);left-=v;}parts.push(left);vals=parts;t++;}while((vals.some(v=>v<5)||new Set(vals).size<vals.length)&&t<60);
        if(new Set(vals).size<vals.length)return null;
        const d={cats,vals,th};const kind=pick(['big','small','pct','num','pct2']);
        const pre=nar?`${nm(n,'i')} ${th.nar} `:'';let q,ans,dis;
        const mx=vals.indexOf(Math.max(...vals)),mn=vals.indexOf(Math.min(...vals));
        if(kind==='big'){q=`${pre}비율이 가장 <b>큰</b> 것은 무엇일까요?`;ans=cats[mx];dis=cats.filter((_,i)=>i!==mx);if(dis.length<3)dis.push('모두 같다');}
        else if(kind==='small'){q=`${pre}비율이 가장 <b>작은</b> 것은 무엇일까요?`;ans=cats[mn];dis=cats.filter((_,i)=>i!==mn);if(dis.length<3)dis.push('모두 같다');}
        else if(kind==='pct'){const i=randInt(0,cats.length-1);q=`${pre}<b>${cats[i]}</b>${josaW(cats[i],'eun')} 전체의 몇 %일까요? (그래프에서 찾아 쓰세요)`;ans=vals[i]+'%';dis=[vals[i]+5,vals[i]-5,vals[i]+10,vals[i]-10,vals[i]*2].filter(x=>x>0&&x<100&&x!==vals[i]).map(x=>x+'%');}
        else if(kind==='num'){const T=pick([20,40,50,100,200]);const i=randInt(0,cats.length-1);const v=T*vals[i]/100;if(!Number.isInteger(v))return null;q=`${pre}전체 학생이 <b>${T}명</b>이라면 <b>${cats[i]}</b>${josaW(cats[i],'eun')} 몇 명일까요?`;ans=v+'명';dis=[v+T/20,v-T/20,v*2,T-v,v+T/10].filter(x=>x>0&&x!==v&&Number.isInteger(x)).map(x=>x+'명');}
        else{let a=randInt(0,cats.length-1),b=randInt(0,cats.length-1);while(a===b)b=randInt(0,cats.length-1);q=`${pre}<b>${cats[a]}</b>${josaW(cats[a],'wa')} <b>${cats[b]}</b>${josaW(cats[b],'eul')} 합하면 전체의 몇 %일까요?`;const s=vals[a]+vals[b];ans=s+'%';dis=[s+5,s-5,s+10,s-10,Math.abs(vals[a]-vals[b])].filter(x=>x>0&&x<=100&&x!==s).map(x=>x+'%');}
        const title=th.title.replace('학생 수','학생 수의 비율').replace('책의 수','책의 비율').replace('과일별 수','과일의 비율');
        return {q,viz:type==='pieRead'?pieSvg(d,title):bandSvg(d,title),ans,distract:dis};
      }
    }
    return null;
  }
};
function shapeSvg2(sh,fill,cx,cy,r){
  const st=`fill="${fill}" stroke="#334155" stroke-width="1.2" stroke-linejoin="round"`;
  if(sh===0)return `<circle cx="${r2(cx)}" cy="${r2(cy)}" r="${r2(r)}" ${st}/>`;
  if(sh===1)return `<rect x="${r2(cx-r*.9)}" y="${r2(cy-r*.9)}" width="${r2(r*1.8)}" height="${r2(r*1.8)}" rx="1.5" ${st}/>`;
  if(sh===2)return `<polygon points="${r2(cx)},${r2(cy-r)} ${r2(cx+r)},${r2(cy+r*.8)} ${r2(cx-r)},${r2(cy+r*.8)}" ${st}/>`;
  let p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r*1.05;p.push(r2(cx+rr*Math.cos(a))+','+r2(cy+rr*Math.sin(a)));}return `<polygon points="${p.join(' ')}" ${st}/>`;
}
