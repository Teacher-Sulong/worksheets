  <script>
    // ── QR 정답지 설정: 스캔하면 이 생성기의 정답지 화면이 바로 열려요 ──
    const ANSWER_URL = 'https://teacher-sulong.github.io/worksheets/unit.html';
    let QR_MODE = 'link';
    // 정답지 화면: 휴대폰 화면 폭에 학습지 한 장이 통째로 보이도록 맞춤
    function fitAnswerView(){ if(!document.body.classList.contains('answer-view'))return; var c=document.getElementById('print-pages-container'); if(!c)return; c.style.zoom=Math.min(1,(window.innerWidth-12)/850); }
    window.addEventListener('resize', fitAnswerView);
    window.addEventListener('hashchange', function () { if (/^#k[-=]/.test(location.hash)) location.reload(); });
// ═════════════════════ 공통 코어 (시계·달력 생성기와 동일한 구성) ═════════════════════
// ───────── 시드 난수 (QR 재현용) ─────────
function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
let rng = Math.random;
function randInt(a,b){return Math.floor(rng()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(rng()*arr.length)];}
function shuffle(a){const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));const t=r[i];r[i]=r[j];r[j]=t;}return r;}
function sample(a,n){return shuffle(a).slice(0,n);}
function chance(p){return rng()<p;}
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return h>>>0;}
function comma(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,',');}
function plain(h){return String(h).replace(/<svg[\s\S]*?<\/svg>/g,'').replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/\s+/g,' ').trim();}
function uniq(a){return [...new Set(a)];}
function sum(a){return a.reduce((x,y)=>x+y,0);}

// ───────── 한국어 조사 ─────────
const NAMES=['이준','하준','도윤','서준','은우','시우','유준','주원','서윤','서아','이서','지유','하린','아린','시아','하은','소율','채원'];
function hasBatchim(w){if(!w)return false;const c=w.charCodeAt(w.length-1);if(c<0xac00||c>0xd7a3)return false;return (c-0xac00)%28>0;}
function dispName(n){return n+(hasBatchim(n)?'이':'');}
function josaW(w,t){const b=hasBatchim(w);if(t==='eun')return b?'은':'는';if(t==='i')return b?'이':'가';if(t==='eul')return b?'을':'를';if(t==='wa')return b?'과':'와';if(t==='ro')return b?'으로':'로';return '';}
function josaNum(s,t){const d=String(s).replace(/[^0-9]/g,'').slice(-1);const b='013678'.includes(d||'2');if(t==='eun')return b?'은':'는';if(t==='i')return b?'이':'가';if(t==='eul')return b?'을':'를';if(t==='wa')return b?'과':'와';return '';}
function pickName(){return pick(NAMES);}
function nm(n,t){const d=dispName(n);return d+josaW(d,t);}   // nm('하준','i') → 하준이가
function jw(w,t){return w+josaW(w,t);}                       // jw('사과','eul') → 사과를

// ───────── SVG 헬퍼 ─────────
let _u=0;function uid(){return 'u'+(++_u);}
function svgWrap(w,h,inner,cls){return `<svg class="viz ${cls||''}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" font-family="'Noto Sans KR',sans-serif">${inner}</svg>`;}
function Tx(x,y,s,o){o=o||{};const size=o.size||12,fill=o.fill||'#1e293b',anchor=o.anchor||'middle',weight=o.weight||600;return `<text x="${x}" y="${y}" font-size="${size}" fill="${fill}" text-anchor="${anchor}" font-weight="${weight}"${o.rot?` transform="rotate(${o.rot} ${x} ${y})"`:''}${o.op?` opacity="${o.op}"`:''}>${s}</text>`;}
function ansG(inner){return `<g class="ansonly">${inner}</g>`;}
function rnd1(n){return Math.round(n*10)/10;}
function r2(n){return Math.round(n*100)/100;}

// ───────── 상태 ─────────
const ALL_S=['subjective','objective','narrative'];
const KOREAN_STYLES={subjective:'주관식',objective:'객관식',narrative:'문장제'};
let ALL_T=[],TYPE={};
const O=()=>config.opt;
let config=null,generatedPages=[],pageSeeds=[],showAnswers=false,answerViewMode=false;

function initConfig(){
  GEN.groups.forEach(g=>g.types.forEach(t=>{ALL_T.push(t.key);TYPE[t.key]=t;}));
  config={pages:2,questionsPerPage:9,level:GEN.defLevel,progression:'single',bigMode:false,boldKey:true,opt:{},sel:{},
    styles:ALL_S.slice(),types:ALL_T.slice(),typeWeights:{},dateStr:''};
  GEN.checks.forEach(c=>config.opt[c.id]=!!c.def);
  GEN.selects.forEach(s=>config.sel[s.id]=s.def);
}

// ───────── 문제 생성 ─────────
function perQLevel(gi,total){
  const L=config.level,mode=config.progression;
  if(mode==='single'||L<=1||total<=1)return L;
  const r=gi/(total-1);let v;
  if(mode==='asc')v=1+Math.round(r*(L-1));
  else if(mode==='desc')v=1+Math.round((1-r)*(L-1));
  else v=randInt(1,L);
  return Math.max(1,Math.min(L,v));
}
function makeQuestion(type,style,lv){
  const o=GEN.build(type,style,lv);
  if(!o)return null;
  o.type=type;o.style=style;o.lv=lv;
  if(!o.viz)o.viz='';
  if(style==='objective'){
    if(!o.choices){
      const a=String(o.ans);
      const ds=uniq((o.distract||[]).map(String)).filter(x=>x!==a);
      if(ds.length<3)return null;
      const ch=shuffle([a].concat(shuffle(ds).slice(0,3)));
      o.choices=ch;o.correctIdx=ch.indexOf(a);
    }
    o.ansKey=(o.correctIdx+1)+'번';
  } else {
    o.ansKey=plain(o.ans);
  }
  return o;
}
function buildPageQuestions(seed,pIdx){
  rng=mulberry32(seed>>>0);
  const qpp=config.questionsPerPage,total=config.pages*qpp,out=[],seen=new Set();
  const selT=ALL_T.filter(t=>config.types.includes(t));const types=selT.length?selT:[ALL_T[0]];
  const selS=ALL_S.filter(s=>config.styles.includes(s));const styles=selS.length?selS:['subjective'];
  for(let q=0;q<qpp;q++){
    const gi=pIdx*qpp+q;const lv=perQLevel(gi,total);
    const dist=t=>{const T=TYPE[t];return lv<T.minLv?T.minLv-lv:(lv>(T.maxLv||99)?lv-(T.maxLv||99):0);};
    let cand=types.filter(t=>dist(t)===0);
    if(!cand.length){const md=Math.min(...types.map(dist));cand=types.filter(t=>dist(t)===md);}
    const pool=[];
    cand.forEach(t=>{let w=Math.max(1,Math.min(5,config.typeWeights[t]||1));if(TYPE[t].minLv>=lv-1&&TYPE[t].minLv>1)w*=2;for(let i=0;i<w;i++)pool.push(t);});
    let o=null;
    for(let n=0;n<40;n++){
      const type=pool[Math.floor(rng()*pool.length)];const T=TYPE[type];
      const eLv=Math.max(T.minLv,Math.min(T.maxLv||99,lv));
      const allowed=T.styles||ALL_S;let av=styles.filter(s=>allowed.includes(s));if(!av.length)av=[allowed[0]];
      const style=pick(av);
      let c=null;
      try{c=makeQuestion(type,style,eLv);}catch(e){console.error('build error',type,e&&e.stack||e);c=null;}
      if(!c)continue;
      const sig=hash(plain(c.q)+'|'+c.ansKey+'|'+String(c.viz).replace(/u\d+/g,''));
      if(!seen.has(sig)||n>=39){o=c;seen.add(sig);break;}
    }
    if(!o){
      try{o=makeQuestion(types[0],'subjective',Math.max(TYPE[types[0]].minLv,Math.min(TYPE[types[0]].maxLv||99,lv)));}catch(e){console.error('fallback error',e);}
    }
    if(!o)o={q:'(문제 생성 오류)',viz:'',ans:'-',ansKey:'-',style:'subjective',type:types[0],lv:lv};
    o.seq=q;out.push(o);
  }
  out.forEach((o,i)=>{o.num=i+1;o.globalNum=pIdx*qpp+i+1;});
  return out;
}

// ───────── QR 자동 채점 (상태 인코딩) ─────────
function encodeState(seed,pIdx){
  let tmask=0;ALL_T.forEach((t,i)=>{if(config.types.includes(t))tmask|=(1<<i);});
  let smask=0;ALL_S.forEach((s,i)=>{if(config.styles.includes(s))smask|=(1<<i);});
  let flags=(config.bigMode?1:0)|(config.boldKey?2:0);
  GEN.checks.forEach((c,i)=>{if(config.opt[c.id])flags|=(1<<(2+i));});
  const parts=[flags,tmask,smask,config.questionsPerPage,config.pages,pIdx,(seed>>>0),config.level,({single:0,asc:1,desc:2,mix:3}[config.progression]||0)];
  GEN.selects.forEach(s=>{parts.push(Math.max(0,s.options.findIndex(o=>o[0]===config.sel[s.id])));});
  let wStr='',any=false;ALL_T.forEach(t=>{const w=Math.max(1,Math.min(5,config.typeWeights[t]||1));if(w!==1)any=true;wStr+=String(w);});
  const out=parts.map(n=>n.toString(36));if(any)out.push(wStr);return out.join('-');
}
function decodeState(str){
  const tok=str.split(/[.-]/);const nSel=GEN.selects.length;const p=tok.map((x,i)=>i<9+nSel?parseInt(x,36):x);
  const flags=p[0];const wStr=(tok.length>9+nSel)?tok[9+nSel]:null;
  const w={};ALL_T.forEach((t,i)=>{w[t]=wStr?(parseInt(wStr[i],10)||1):1;});
  const opt={};GEN.checks.forEach((c,i)=>{opt[c.id]=!!(flags&(1<<(2+i)));});
  const sel={};GEN.selects.forEach((s,i)=>{const o=s.options[p[9+i]];sel[s.id]=o?o[0]:s.def;});
  return {big:(flags&1)?1:0,bk:(flags&2)?1:0,opt,sel,ty:ALL_T.filter((t,i)=>p[1]&(1<<i)),st:ALL_S.filter((s,i)=>p[2]&(1<<i)),qpp:p[3],pg:p[4],p:p[5],sd:(p[6]>>>0),lv:p[7]||1,prog:({0:'single',1:'asc',2:'desc',3:'mix'}[p[8]]||'single'),w};
}
function applyState(s){
  config.bigMode=!!s.big;config.boldKey=!!s.bk;config.opt=s.opt;config.sel=s.sel;config.level=s.lv;config.progression=s.prog||'single';
  config.styles=(s.st&&s.st.length)?s.st:['subjective'];config.types=(s.ty&&s.ty.length)?s.ty:[ALL_T[0]];
  config.questionsPerPage=s.qpp;config.pages=s.pg;config.typeWeights=s.w||{};
}
function buildAnswerKeyText(pIdx){const qs=generatedPages[pIdx]||[];return qs.map(q=>`${q.globalNum}) ${q.ansKey}`).join('  ');}
function makeQRCodes(){
  if(typeof qrcode==='undefined')return;
  try{if(qrcode.stringToBytesFuncs&&qrcode.stringToBytesFuncs['UTF-8'])qrcode.stringToBytes=qrcode.stringToBytesFuncs['UTF-8'];}catch(e){}
  const hosted=(QR_MODE!=='text')&&(!!ANSWER_URL||/^https?:$/.test(location.protocol));const base=hosted?(ANSWER_URL||location.href.split('#')[0]):'';
  generatedPages.forEach((_,pIdx)=>{
    const el=document.getElementById('qr-'+pIdx);if(!el)return;
    const data=hosted?(base+'#k-'+encodeState(pageSeeds[pIdx],pIdx)):buildAnswerKeyText(pIdx);
    const draw=(txt,ec)=>{const qr=qrcode(0,ec);qr.addData(txt,'Byte');qr.make();el.innerHTML=qr.createSvgTag({cellSize:4,margin:3,scalable:true});const svg=el.querySelector('svg');if(svg){svg.setAttribute('width','100%');svg.setAttribute('height','100%');svg.style.display='block';}};
    try{draw(data,'L');}catch(e){try{draw(data,'M');}catch(e2){el.innerHTML='<span class="text-[7px] text-slate-400">QR</span>';}}
  });
}
function tryAnswerView(){
  const h=location.hash||'';const i=h.search(/k[-=]/);if(i<0)return false;
  let s;try{s=decodeState(h.slice(i+2));}catch(e){return false;}if(!s||s.sd===undefined||isNaN(s.sd))return false;
  applyState(s);answerViewMode=true;showAnswers=true;
  generatedPages=[buildPageQuestions(s.sd>>>0,s.p)];pageSeeds=[s.sd>>>0];
  document.body.classList.add('answer-view');setTimeout(fitAnswerView,30);renderHTML();
  document.querySelectorAll('.answer-box').forEach(el=>{el.classList.remove('invisible','opacity-0');el.classList.add('visible','opacity-100');});
  const cont=document.getElementById('print-pages-container');
  if(cont)cont.insertAdjacentHTML('afterbegin','<div class="max-w-[840px] mx-auto mb-3 bg-emerald-600 text-white rounded-xl px-4 py-2 text-sm font-bold flex items-center justify-between"><span>✔ 정답지 (채점용) — made by 특수교사 슬옹쌤</span></div>');
  tryIcons();return true;
}

// ───────── 옵션 패널 (동적 구성) ─────────
function buildPanel(){
  const C='teal-600';
  const lvOpts=GEN.levels.map((l,i)=>`<option value="${i+1}"${(i+1)===GEN.defLevel?' selected':''}>${l.s} (${l.d})</option>`).join('');
  const checks=GEN.checks.map(c=>`<label class="flex items-center gap-2.5 text-xs text-slate-600 cursor-pointer"><input type="checkbox" id="opt-${c.id}" class="w-4 h-4 text-${C} rounded"${c.def?' checked':''} onchange="regenerateSheet()"><span>${c.label}</span></label>`).join('');
  const sels=GEN.selects.map(s=>`<div class="space-y-3"><label class="block text-sm font-semibold text-slate-700">${s.title}</label><div class="grid grid-cols-${Math.min(3,s.options.length)} gap-2">${s.options.map(o=>`<label class="cursor-pointer border border-slate-200 rounded-lg p-2 flex flex-col items-center gap-1 bg-white hover:bg-slate-50 [&:has(input:checked)]:border-${C} [&:has(input:checked)]:bg-teal-50"><input type="radio" name="sel-${s.id}" value="${o[0]}" class="sr-only"${o[0]===s.def?' checked':''} onchange="regenerateSheet()"><span class="text-xs font-semibold text-center">${o[1]}</span></label>`).join('')}</div>${s.note?`<p class="text-xs text-slate-400">${s.note}</p>`:''}</div>`).join('');
  const groups=GEN.groups.map(g=>`<div class="flex items-center justify-between pt-1"><span class="text-[10px] font-extrabold text-slate-400 uppercase tracking-wide">${g.label}</span><label class="flex items-center gap-1 text-[10px] text-slate-500 cursor-pointer"><input type="checkbox" class="group-toggle w-3.5 h-3.5 text-${C} rounded" data-grp="grp-${g.id}" checked onchange="toggleGroup(this,'grp-${g.id}')">전체</label></div>
        <div id="grp-${g.id}" class="grid grid-cols-1 gap-2 border border-slate-100 p-2 rounded-lg bg-slate-50">${g.types.map(t=>`<label class="flex items-center gap-2 text-xs text-slate-600 cursor-pointer"><input type="checkbox" class="type-checkbox w-3.5 h-3.5 text-${C} rounded" value="${t.key}" checked onchange="regenerateSheet()"><span>${t.label}</span></label>`).join('')}</div>`).join('');
  document.getElementById('option-panel').innerHTML=`
      <div class="flex items-center gap-2 pb-4 border-b border-slate-100">
        <i data-lucide="sliders" class="w-5 h-5 text-${C}"></i>
        <h2 class="text-lg font-bold text-slate-950">학습지 형성 옵션</h2>
      </div>
      <div class="space-y-3">

function readOptions(){
  const g=id=>document.getElementById(id);
  config.level=parseInt(g('difficulty').value)||GEN.defLevel;
  config.progression=g('progression').value||'single';
  GEN.checks.forEach(c=>{config.opt[c.id]=g('opt-'+c.id).checked;});
  config.bigMode=g('opt-big').checked;config.boldKey=g('opt-boldkey').checked;
  GEN.selects.forEach(s=>{const r=document.querySelector(`input[name="sel-${s.id}"]:checked`);config.sel[s.id]=r?r.value:s.def;});
  config.typeWeights={};document.querySelectorAll('.type-weight').forEach(i=>config.typeWeights[i.dataset.type]=Math.max(1,Math.min(5,parseInt(i.value)||1)));
  const st=[];if(g('style-subjective').checked)st.push('subjective');if(g('style-objective').checked)st.push('objective');if(g('style-narrative').checked)st.push('narrative');
  config.styles=st.length?st:['subjective'];if(!st.length)g('style-subjective').checked=true;
  const ty=[];document.querySelectorAll('.type-checkbox:checked').forEach(e=>ty.push(e.value));

}
function toggleGroup(cb,gid){const g=document.getElementById(gid);if(g)g.querySelectorAll('.type-checkbox').forEach(x=>{x.checked=cb.checked;});regenerateSheet();}
function syncGroupToggles(){document.querySelectorAll('.group-toggle').forEach(gt=>{const g=document.getElementById(gt.dataset.grp);if(!g)return;const items=[...g.querySelectorAll('.type-checkbox')];gt.checked=items.length>0&&items.every(x=>x.checked);});}
function regenerateSheet(){
  syncGroupToggles();readOptions();generatedPages=[];pageSeeds=[];
  const base=((Date.now()^Math.floor(Math.random()*0x1000000))&0xFFFFFF)>>>0;
  for(let p=0;p<config.pages;p++){const sd=(base+p*0x9E3779B1)>>>0;pageSeeds.push(sd);generatedPages.push(buildPageQuestions(sd,p));}
  renderHTML();tryIcons();
}

function rulerSvg(o){
  const W=240,x0=14,x1=226,cw=(x1-x0)/o.max,yR=58,rh=42;
  let g=`<rect x="${x0-8}" y="${yR}" width="${x1-x0+16}" height="${rh}" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>`;
  for(let mm=0;mm<=o.max*10;mm++){
    const x=x0+mm*cw/10;
    if(mm%10===0){g+=`<line x1="${x}" y1="${yR}" x2="${x}" y2="${yR+15}" stroke="#78350f" stroke-width="1.3"/>`+Tx(x,yR+27,mm/10,{size:o.max>12?9:10.5,fill:'#78350f',weight:700});}
    else if(o.mm&&mm%5===0)g+=`<line x1="${x}" y1="${yR}" x2="${x}" y2="${yR+11}" stroke="#78350f" stroke-width="1"/>`;
    else if(o.mm)g+=`<line x1="${x}" y1="${yR}" x2="${x}" y2="${yR+7}" stroke="#78350f" stroke-width=".8"/>`;
  }
  g+=Tx(x1+5,yR+rh-4,'cm',{size:8,fill:'#78350f',anchor:'end',weight:800});
  const xs=x0+o.s*cw,xe=x0+o.e*cw,yo=24,hh=15;
  if(o.guide){g+=`<line x1="${xs}" y1="${yo+hh}" x2="${xs}" y2="${yR}" stroke="#94a3b8" stroke-dasharray="3 2"/><line x1="${xe}" y1="${yo+hh/2}" x2="${xe}" y2="${yR}" stroke="#94a3b8" stroke-dasharray="3 2"/>`;}
  if(o.kind==='pencil'){
    const tl=Math.min(16,(xe-xs)*.3);
    g+=`<rect x="${xs}" y="${yo}" width="${Math.max(4,Math.min(7,(xe-xs)*.12))}" height="${hh}" fill="#f472b6" stroke="#475569"/>`;
    g+=`<rect x="${xs+6}" y="${yo}" width="${xe-xs-tl-6}" height="${hh}" fill="#facc15" stroke="#475569"/>`;
    g+=`<path d="M${xe-tl} ${yo} L${xe} ${yo+hh/2} L${xe-tl} ${yo+hh} Z" fill="#fde68a" stroke="#475569"/><path d="M${xe-tl*.35} ${yo+hh*.33} L${xe} ${yo+hh/2} L${xe-tl*.35} ${yo+hh*.67} Z" fill="#334155"/>`;
  } else {
    g+=`<rect x="${xs}" y="${yo}" width="${xe-xs}" height="${hh}" rx="3" fill="${o.color||'#60a5fa'}" stroke="#334155"/>`;
  }
  return svgWrap(W,106,g);
}
function tapeSvg(o){ // o:{max,tick,labelEvery,pt,unit}

  let g=`<rect x="${x0-8}" y="${yT}" width="${x1-x0+16}" height="${th}" rx="4" fill="#fde047" stroke="#a16207" stroke-width="1.4"/>`;
  for(let v=0;v<=o.max;v+=o.tick){
    const x=x0+v*cw,lab=(v%o.labelEvery===0);
    g+=`<line x1="${x}" y1="${yT}" x2="${x}" y2="${yT+(lab?15:9)}" stroke="#713f12" stroke-width="${lab?1.4:1}"/>`;
    if(lab)g+=Tx(x,yT+28,o.fmt?o.fmt(v):v,{size:9.5,fill:'#713f12',weight:700});
  }
  const xp=x0+o.pt*cw;
  g+=`<path d="M${xp} ${yT-2} v-24" stroke="#e11d48" stroke-width="2.4"/><path d="M${xp} ${yT-2} l-5 -9 h10 z" fill="#e11d48"/>`;
  return svgWrap(W,yT+th+8,g);
}

function dialSvg(sp,v){
  const W=240,H=172,cx=120,cy=88,R=72,A0=-150,SW=300;
  const ang=x=>A0+SW*x/sp.max,P=(a,r)=>[cx+r*Math.sin(a*Math.PI/180),cy-r*Math.cos(a*Math.PI/180)];
  let g=`<circle cx="${cx}" cy="${cy}" r="${R+5}" fill="#e2e8f0" stroke="#475569" stroke-width="2.5"/><circle cx="${cx}" cy="${cy}" r="${R}" fill="#fff" stroke="#94a3b8" stroke-width="1"/>`;
  for(let t=0;t<=sp.max+1e-9;t+=sp.minor){
    const major=Math.abs(t/sp.major-Math.round(t/sp.major))<1e-9,a=ang(t),p1=P(a,R-3),p2=P(a,R-(major?13:7));
    g+=`<line x1="${r2(p1[0])}" y1="${r2(p1[1])}" x2="${r2(p2[0])}" y2="${r2(p2[1])}" stroke="#1e293b" stroke-width="${major?1.8:1}"/>`;
    if(major){const pl=P(a,R-24);g+=Tx(r2(pl[0]),r2(pl[1]+3.5),sp.lab(Math.round(t*10)/10),{size:sp.lsize||9,weight:700,fill:'#1e293b'});}
  }
  g+=Tx(cx,cy+34,sp.unit,{size:12,weight:800,fill:'#64748b'});
  const pn=P(ang(v),R-9),pt=P(ang(v)+180,12);
  g+=`<line x1="${r2(pt[0])}" y1="${r2(pt[1])}" x2="${r2(pn[0])}" y2="${r2(pn[1])}" stroke="#dc2626" stroke-width="2.6" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="5" fill="#dc2626"/><circle cx="${cx}" cy="${cy}" r="1.8" fill="#fff"/>`;
  g+=`<rect x="${cx-34}" y="${cy+R+7}" width="68" height="9" rx="3" fill="#94a3b8"/>`;
  return svgWrap(W,H,g);
}

function cupSvg(sp,v){
  const W=240,H=182,bx=104,bw=58,top=14,bot=160,hh=bot-top;
  const yy=t=>bot-hh*t/sp.max;
  let g=`<path d="M${bx} ${yy(v)} H${bx+bw} V${bot-6} Q${bx+bw} ${bot} ${bx+bw-6} ${bot} H${bx+6} Q${bx} ${bot} ${bx} ${bot-6} Z" fill="#7dd3fc" fill-opacity=".75"/>`;
  g+=`<line x1="${bx}" y1="${r2(yy(v))}" x2="${bx+bw}" y2="${r2(yy(v))}" stroke="#0284c7" stroke-width="1.6"/>`;
  g+=`<path d="M${bx-3} ${top-3} L${bx} ${top} V${bot-6} Q${bx} ${bot} ${bx+6} ${bot} H${bx+bw-6} Q${bx+bw} ${bot} ${bx+bw} ${bot-6} V${top} L${bx+bw+3} ${top-3}" fill="none" stroke="#334155" stroke-width="2.2"/>`;
  for(let t=0;t<=sp.max+1e-9;t+=sp.minor){
    const major=Math.abs(t/sp.major-Math.round(t/sp.major))<1e-9,y=yy(t);
    g+=`<line x1="${bx}" y1="${r2(y)}" x2="${bx+(major?16:9)}" y2="${r2(y)}" stroke="#1e293b" stroke-width="${major?1.6:1}"/>`;
    if(major)g+=Tx(bx-6,r2(y+3.5),sp.lab(Math.round(t*10)/10),{size:9.5,weight:700,anchor:'end',fill:'#1e293b'});
  }
  g+=Tx(bx+bw+10,top+8,sp.unit,{size:11,weight:800,fill:'#64748b',anchor:'start'});
  return svgWrap(W,H,g);
}
function qtyViz(label,val,unit){
  const w=Math.max(54,String(val).length*13+8);

function unitDistract(u){

        if(sp.L){ans=fmtMl(v);dis=[v+100,v-100,v+200,v-200,v+1000,v-1000].filter(x=>x>0&&x<sp.max).map(fmtMl);}
        else{ans=`${v} ${U('mL')}`;dis=[v+mi,v-mi,v+2*mi,v-2*mi,v+sp.major].filter(x=>x>0&&x<sp.max).map(x=>`${x} ${U('mL')}`);}
        const q=(sp.L&&v>=1000)?`물의 양은 몇 <b>${U('L')} 몇 ${U('mL')}</b>일까요?${HT('1 L = 1000 mL')}`:`물의 양은 몇 <b>${U('mL')}</b>일까요?${HT('눈금 한 칸의 크기를 먼저 알아봐요')}`;
        const q2=nar?`${nm(n,'i')} 계량컵에 물을 부었어요. ${q}`:q;
        return mk(q2,cupSvg(sp,v),ans,dis);
      }
      case 'convert':{
        const kinds=lv>=5?['length','length','weight','weight','volume','tons']:['length','length','weight','volume'];
        const kind=pick(kinds);
        const defs={length:[['m','cm',100],['cm','mm',10]],weight:[['kg','g',1000]],volume:[['L','mL',1000]],tons:[['t','kg',1000]]}[kind];
        const [big,small,f]=pick(defs);const bs=U(big),ss=U(small);
        const hintTxt=`1 ${bs} = ${comma(f)} ${ss}`;
        let q,ans,dis,A;
        if(lv===4){
          const k=randInt(2,9);
          if(chance(.5)){A=k*f;q=`<b>${k} ${bs}</b> = ( ) ${ss}`;ans=`${comma(A)} ${ss}`;dis=[A*10,A/10,A+f,A-f,A*100].filter(x=>x>0&&Number.isInteger(x)).map(x=>`${comma(x)} ${ss}`);}
          else{A=k*f;q=`<b>${comma(A)} ${ss}</b> = ( ) ${bs}`;ans=`${k} ${bs}`;dis=[k*10,k+1,k-1,k*100,k+2].filter(x=>x>0).map(x=>`${comma(x)} ${bs}`);}
        } else {
          const k=randInt(1,lv>=6?30:9);const m=f===10?randInt(1,9):(chance(.5)?randInt(1,9)*(f/10):randInt(1,f-1));
          const total=k*f+m;
          const step=Math.max(1,f/10);
          if(chance(.5)){q=`<b>${k} ${bs} ${m} ${ss}</b> = ( ) ${ss}`;ans=`${comma(total)} ${ss}`;
            dis=[total+f,total-f,Number(`${k}${m}`),total*10,k*f+m*10,total+step,total-step].filter(x=>x>0&&x!==total&&Number.isInteger(x)).map(x=>`${comma(x)} ${ss}`);}
          else{q=`<b>${comma(total)} ${ss}</b> = ( ) ${bs} ( ) ${ss}`;ans=fmtComp(big,k,small,m);
            dis=[[m,k],[k+1,m],[k-1,m],[k,m+step],[k,m-step],[k*10,m],[k,m*10]].filter(([a,b])=>a>0&&b>0&&b<f&&!(a===k&&b===m)).map(([a,b])=>fmtComp(big,a,small,b));}
        }
        const qq=nar?`${nm(n,'i')} 단위를 바꾸어 보려고 해요. ${q}`:q;
        return mk(qq+HT(hintTxt),'',ans,dis);
      }
      case 'cmpUnits':{
        const kind=pick(['length','weight','volume']);
        const [big,small,f]={length:['m','cm',100],weight:['kg','g',1000],volume:['L','mL',1000]}[kind];
        const k=randInt(1,9),m=randInt(1,9)*(f/10);const a=k*f+m;
        const r=pick(['eq','gt','lt','gt','lt']);let b=a;
        if(r==='gt')b=a-randInt(1,3)*(f/10);if(r==='lt')b=a+randInt(1,3)*(f/10);
        if(b<=0)return null;
        const left=chance(.5)?`${k} ${U(big)} ${m} ${U(small)}`:`${comma(a)} ${U(small)}`;
        const right=left.includes(U(big))?`${comma(b)} ${U(small)}`:`${Math.floor(b/f)} ${U(big)} ${b%f} ${U(small)}`;
        if(b%f===0&&!left.includes(U(big)))return null;
        const L=left,R=right;const sym=a>b?'>':a<b?'<':'=';
        const viz=svgWrap(240,64,Tx(56,38,L,{size:L.length>9?12:14,weight:800,anchor:'middle'})+`<circle cx="120" cy="32" r="14" fill="#fff" stroke="#64748b" stroke-width="1.6"/>`+ansG(Tx(120,38,sym.replace('>','&gt;').replace('<','&lt;'),{size:17,fill:'#ef4444',weight:900}))+Tx(184,38,R,{size:R.length>9?12:14,weight:800,anchor:'middle'}));
        const o=mk(nar?`${nm(n,'i')} 두 양을 비교하려고 해요. ○ 안에 <b>&gt;, &lt;, =</b> 중 알맞은 것을 써넣으세요.`:`○ 안에 <b>&gt;, &lt;, =</b> 중 알맞은 것을 써넣으세요.${HT(`1 ${U(big)} = ${comma(f)} ${U(small)}`)}`,viz,sym.replace('>','&gt;').replace('<','&lt;'));
        o.choices=['&gt;','&lt;','='];o.correctIdx=o.choices.indexOf(o.ans);
        return o;
      }
      case 'addUnits':{
        const kind=pick(['length','weight','volume']);
        const [big,small,f]={length:['m','cm',100],weight:['kg','g',1000],volume:['L','mL',1000]}[kind];
        const step=f/10;let a,b,r,op;
        const k1=randInt(1,6),k2=randInt(1,5),m1=randInt(1,9)*step,m2=randInt(1,9)*step;
        if(chance(.5)){op='+';a=k1*f+m1;b=k2*f+m2;r=a+b;}
        else{op='-';a=Math.max(k1,k2)*f+m1+(k1===k2?f:0);b=Math.min(k1,k2)*f+m2;if(a<=b){a+=f;}r=a-b;}
        if(r%f===0)return null;
        const fa=fmtComp(big,Math.floor(a/f),small,a%f),fb=fmtComp(big,Math.floor(b/f),small,b%f);
        if(a%f===0||b%f===0)return null;
        const ans=fmtComp(big,Math.floor(r/f),small,r%f);
        const dis=[r+step,r-step,r+f,r-f,r+2*step].filter(x=>x>0&&x%f!==0).map(x=>fmtComp(big,Math.floor(x/f),small,x%f));
        const q=nar?`${nm(n,'i')} ${op==='+'?'두 양을 더해 보려고':'큰 양에서 작은 양을 빼 보려고'} 해요. <b>${fa} ${op} ${fb}</b> = ( )`:`<b>${fa} ${op==='+'?'+':'−'} ${fb}</b> = ( )${HT(`1 ${U(big)} = ${comma(f)} ${U(small)}`)}`;
        return mk(q,'',ans,dis);
      }
    }
    return null;
  }
};

window.regenerateSheet=regenerateSheet;window.toggleAnswers=toggleAnswers;window.printSheet=printSheet;
window.setPagesDropdown=setPagesDropdown;window.updateQuestionsCount=updateQuestionsCount;window.toggleGroup=toggleGroup;
function initApp(){initConfig();buildPanel();initDate();if(tryAnswerView())return;setupTypeWeights();regenerateSheet();}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',initApp);else initApp();

  </script>
